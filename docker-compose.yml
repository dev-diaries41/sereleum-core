services:
  sereleum:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - shared_data:/data
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REVELIUM_BASE_DIR=/data
    depends_on:
      - redis
      - chromadb
    restart: unless-stopped
  chromadb:
    image: chromadb/chroma
    volumes:
      - chroma_data:/data/chroma
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
  dramatiq_worker:
    build: .
    command: dramatiq api.tasks --processes 1 --threads 1
    volumes:
      - .:/app
      - shared_data:/data
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REVELIUM_BASE_DIR=/data
    depends_on:
      - redis
      - sereleum
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"] # use "allkeys-lru" to evict last recently used keys
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}  # Pass the password to Redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]  # Use the environment variable in the health check
      interval: 30s
      timeout: 10s
      retries: 3
